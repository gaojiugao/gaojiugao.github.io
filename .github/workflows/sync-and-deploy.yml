name: Auto Sync YouTube & Deploy Pages

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-sync-deploy"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync @sunjay5968 YouTube RSS feed
        id: sync
        run: node scripts/sync-youtube.mjs

      - name: Commit and push updated videos.js
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos.js
          git diff --cached --quiet || git commit -m "chore: auto-sync YouTube videos [skip ci]"
          git push

      - name: Stage static site files
        if: github.event_name != 'schedule' || steps.sync.outputs.changed == 'true'
        run: |
          mkdir -p _site
          cp index.html styles.css videos.js app.js _site/
          if [ -d assets ]; then
            cp -r assets _site/
          fi

      - name: Setup GitHub Pages
        if: github.event_name != 'schedule' || steps.sync.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'schedule' || steps.sync.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: sync
    if: github.event_name != 'schedule' || needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
